<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="cadsatro.php" method="get">
      <p>
        <label for="num1">Número 1 :</label>
        <input
          type="number"
          id="num1"
          required
          oninput="soma.innerHTML = Number(num1.value) + Number(num2.value)"
        />
      </p>

      <p>
        <label for="num2">Número 2 :</label>
        <input
          type="number"
          id="num2"
          required
          oninput="soma.innerHTML = Number(num1.value) + Number(num2.value)"
        />
      </p>

      <p>
        <label for="soma">Soma :</label>
        <output id="soma">0</output>
      </p>

      <p>
        <input type="submit" />
        <input type="reset" />
      </p>
    </form>
  </body>
</html>
