<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Output</h1>

    <form action="cadastro.php" method="get">
      <p>
        <input
          type="range"
          id="range"
          value="5"
          min="0"
          max="10"
          oninput="val.innerHTML = Number(range.value)"
        />
        <output id="val">5</output>
      </p>

      <p>
        <input type="submit" />
        <input type="reset" />
      </p>
    </form>
  </body>
</html>
