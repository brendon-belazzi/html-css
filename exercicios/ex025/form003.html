<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>checkbox</title>
  </head>
  <body>
    <!-- radio seleciona apenas um (deve ter o mesmo "name")-->
    <form action="cadastro.php">
      <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="sxmas" checked />
        <label for="sxmas">Masculino</label> <br />
        <input type="radio" name="sexo" id="sxfem" />
        <label for="sxfem">Feminino</label>
      </fieldset>
      <fieldset>
        <legend>Esportes</legend>

        <input type="checkbox" name="fut" id="fut" checked />
        <label for="fut">Futebol</label><br />
        <input type="checkbox" name="futv" id="futv" />
        <label for="futv">Futevolei</label><br />
        <input type="checkbox" name="basq" id="basq" />
        <label for="basq">Basquete</label><br />
      </fieldset>
      <div><input type="submit" /></div>
    </form>
  </body>
</html>
